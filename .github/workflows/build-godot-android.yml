name: Build Godot 4.7.2 Android APK

on:
  push:
    branches: [ "main", "master", "feat/**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 & Python 3
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK Build-Tools 34.0.0
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 34, Platform-Tools & Build-Tools 34.0.0
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Download Godot 4.7.2 & Android Export Templates
        run: |
          mkdir -p /tmp/godot472 "${HOME}/.local/share/godot/export_templates"
          curl -sSL -o /tmp/godot472/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          curl -sSL -o /tmp/godot472/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q /tmp/godot472/godot.zip -d /tmp/godot472
          chmod +x /tmp/godot472/Godot_v4.7.2-stable_linux.x86_64
          unzip -q /tmp/godot472/templates.tpz "templates/android_*" "templates/version.txt" -d /tmp/godot472/tpl
          ln -s /tmp/godot472/tpl/templates "${HOME}/.local/share/godot/export_templates/4.7.2.stable"

      - name: Export & Verify Signed Android APK
        env:
          GODOT_BIN: /tmp/godot472/Godot_v4.7.2-stable_linux.x86_64
        run: |
          chmod +x scripts/build_android_apk.sh
          bash scripts/build_android_apk.sh

      - name: Upload Signed Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: incremental-traffic-madiun-android-apk
          path: releases/incremental-traffic-madiun-android.apk
